name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless Pillow imageio-ffmpeg ruff

      - name: Lint（只看语法与未定义名字，正是这类 bug 让我们栽过）
        run: ruff check --select E9,F63,F7,F82 pplib app tools tests

      - name: 单元测试
        run: python -m unittest discover -s tests -v
