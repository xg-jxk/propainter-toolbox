name: build-portable-release

# 推送 v* 标签时自动打包并发布 Release；也可在 Actions 页手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PySide6 与 PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: 打包（exe + 便携 zip）
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          ./build/make.ps1 -SkipInstall -Zip -Python $py

      - name: 留存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## ProPainter 视频修复工具箱 ${{ github.ref_name }}

            便携版（约 49 MB）：解压后双击 `ProPainterToolbox.exe`，
            首次启动会引导**在线安装运行时**（PyTorch + 模型权重，约 2.5 GB）。

            - 下载后请先看包内的 `首次使用.txt`
            - 详细步骤见 README 的「2.1 路线 A：便携版」
            - 仅限处理你拥有版权或已获授权的视频（见 `TERMS.md`）
